name: BarApp
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
packages:
  BarPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  BarApp-iOS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: BarPackage
        products:
          - BarCore
          - BarRecipes
      - target: BarAppWidgets
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: BarApp
        NSCameraUsageDescription: "Scan barcodes on bottles to find or add products."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.barapp.module
            CFBundleURLSchemes: [barapp]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.barapp
        PRODUCT_NAME: BarApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BarApp-macOS:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BarPackage
        products:
          - BarCore
          - BarRecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.barapp
        PRODUCT_NAME: BarApp
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: BarApp
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
  BarAppWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - package: BarPackage
        products:
          - BarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.barapp.widgets
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Widgets/Info.plist
  BarAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: BarApp-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  BarApp-iOS:
    build:
      targets:
        BarApp-iOS: all
        BarAppWidgets: [build]
        BarAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BarAppUITests
  BarApp-macOS:
    build:
      targets:
        BarApp-macOS: all
    run:
      config: Debug
