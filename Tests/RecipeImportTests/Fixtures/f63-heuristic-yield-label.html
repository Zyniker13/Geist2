<!doctype html>
<html><head><meta charset="utf-8"><title>Servings First, Title Later</title></head>
<body>
<h1>Stovetop Mac and Cheese</h1>
<p class="yield">Yield: 6 servings</p>
<p class="meta">Total time: 25 minutes</p>
<h2>Ingredients</h2>
<ul><li>12 oz macaroni</li><li>2 cups cheddar</li><li>1.5 cups milk</li></ul>
<h2>Steps</h2>
<ol><li>Boil the pasta.</li><li>Melt cheese into milk.</li>
<li>Toss together and serve.</li></ol>
</body></html>
