<body>
<h1>Shakshuka</h1>
<p>Recipe Category: Breakfast | Cuisine: Middle Eastern | Serves 4</p>
<h2>Ingredients</h2>
<ul><li>4 eggs</li><li>1 can crushed tomatoes</li><li>1 onion</li></ul>
<h2>Instructions</h2>
<ol><li>Soften the onion.</li><li>Add tomatoes; simmer 15 minutes.</li>
<li>Crack in eggs; cover 8 minutes.</li></ol>
