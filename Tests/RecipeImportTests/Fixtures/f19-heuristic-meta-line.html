<h1>Roast Chicken</h1>
<p class="recipe-meta">Serves 4 | Prep: 20 minutes | Cook: 1 hour 15 minutes</p>
<h2>Ingredients</h2>
<ul>
<li>1 whole chicken, 4 lb</li>
<li>2 lemons, halved</li>
<li>4 sprigs thyme</li>
</ul>
<h2>Method</h2>
<ol>
<li>Season the bird inside and out.</li>
<li>Roast at 425F for 75 minutes.</li>
<li>Rest 15 minutes before carving.</li>
