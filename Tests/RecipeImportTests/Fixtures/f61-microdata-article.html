<!doctype html>
<html><head><meta charset="utf-8"><title>Microdata Recipe via itemprop Recipe</title></head>
<body>
<article itemscope itemtype="https://schema.org/Recipe">
<h1 itemprop="name">Panzanella</h1>
<span itemprop="recipeYield">4 servings</span>
<ul><li itemprop="recipeIngredient">4 cups day-old bread</li>
<li itemprop="recipeIngredient">3 tomatoes</li></ul>
<ol><li itemprop="recipeInstructions">Tear and toast the bread.</li>
<li itemprop="recipeInstructions">Toss with tomatoes and dressing.</li></ol>
</article>
</body></html>
