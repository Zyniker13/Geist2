<!doctype html>
<html><head><meta charset="utf-8"><title>Time Words in Title/No Structured Data</title></head>
<body>
<h1>One-Pot Chicken and Rice</h1>
<p>Prep: 10 mins | Cook: 35 mins | Total: 45 mins | Yield: 4</p>
<h2>Ingredients</h2>
<ul><li>4 chicken thighs</li><li>1.5 cups rice</li><li>2.5 cups broth</li></ul>
<h2>Instructions</h2>
<ol><li>Sear chicken 5 minutes per side.</li>
<li>Add rice and broth; cover 25 minutes.</li>
<li>Rest 5 minutes off heat.</li></ol>
</body></html>
