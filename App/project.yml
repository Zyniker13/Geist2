name: RecipeApp
options:
  bundleIdPrefix: com.bristleconeit
  createIntermediateGroups: true
packages:
  RecipeKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  RecipeApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - RecipeApp
    dependencies:
      - package: RecipeKit
        products:
          - RecipeCore
          - RecipeImport
          - RecipeModules
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bristleconeit.geist2
        PRODUCT_NAME: RecipeApp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: RecipeApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  RecipeAppTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RecipeAppTests
    dependencies:
      - target: RecipeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # Host the tests in the app so app-level state is reachable.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RecipeApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RecipeApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RecipeAppTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RecipeAppTests
    dependencies:
      - target: RecipeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RecipeApp.app/Contents/MacOS/RecipeApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RecipeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RecipeAppUITests
    dependencies:
      - target: RecipeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  RecipeApp-iOS:
    build:
      targets:
        RecipeApp: all
        RecipeAppTests_iOS: [test]
        RecipeAppUITests: [test]
    test:
      targets:
        - RecipeAppTests_iOS
        - RecipeAppUITests
  RecipeApp-macOS:
    build:
      targets:
        RecipeApp: all
        RecipeAppTests_macOS: [test]
    test:
      targets:
        - RecipeAppTests_macOS
