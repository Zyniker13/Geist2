name: RecipeApp
options:
  bundleIdPrefix: com.bristleconeit
  createIntermediateGroups: true
packages:
  RecipeKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  # One app target per platform so each embeds exactly its own share
  # extension: XcodeGen has no per-platform dependency filter, and the
  # iOS appex carries App Group entitlements that macOS ad-hoc signing
  # rejects (decision 0010).
  RecipeApp_iOS:
    type: application
    platform: iOS
    sources:
      - RecipeApp
    dependencies:
      - package: RecipeKit
        products:
          - RecipeCore
          - RecipeImport
          - RecipeModules
      - target: RecipeShareExtension_iOS
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bristleconeit.geist2
        PRODUCT_NAME: RecipeApp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: RecipeApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: RecipeApp/RecipeApp.entitlements
  RecipeApp_macOS:
    type: application
    platform: macOS
    sources:
      - RecipeApp
    dependencies:
      - package: RecipeKit
        products:
          - RecipeCore
          - RecipeImport
          - RecipeModules
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bristleconeit.geist2
        PRODUCT_NAME: RecipeApp
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: RecipeApp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  RecipeShareExtension_iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: RecipeApp/SharedLibrary.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Recipe app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Declared here so `xcodegen generate` writes a complete plist
        # every time; hand edits outside this block were being lost on
        # regeneration, which silently broke the extension.
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.html").@count > 0).@count > 0
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareHandler
    dependencies:
      - package: RecipeKit
        products:
          - RecipeCore
          - RecipeImport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bristleconeit.geist2.ShareExtension
        PRODUCT_NAME: RecipeShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
  RecipeShareExtension_macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
      - path: RecipeApp/SharedLibrary.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Recipe app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.html").@count > 0).@count > 0
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareHandler
    dependencies:
      - package: RecipeKit
        products:
          - RecipeCore
          - RecipeImport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bristleconeit.geist2.ShareExtension
        PRODUCT_NAME: RecipeShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  RecipeAppTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RecipeAppTests
    dependencies:
      - target: RecipeApp_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # Host the tests in the app so app-level state is reachable.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RecipeApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RecipeApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RecipeAppTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RecipeAppTests
    dependencies:
      - target: RecipeApp_macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RecipeApp.app/Contents/MacOS/RecipeApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RecipeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RecipeAppUITests
    dependencies:
      - target: RecipeApp_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  RecipeApp-iOS:
    build:
      targets:
        RecipeApp_iOS: all
        RecipeAppTests_iOS: [test]
        RecipeAppUITests: [test]
    test:
      targets:
        # Unit tests only: the Safari UI test drives Safari and the
        # share sheet (slow, machine specific) and belongs to the
        # RecipeApp-E2E scheme below, which safari-e2e.sh runs.
        - RecipeAppTests_iOS
  RecipeApp-E2E:
    build:
      targets:
        RecipeApp_iOS: all
        RecipeAppUITests: [test]
    test:
      targets:
        - RecipeAppUITests
  RecipeApp-macOS:
    build:
      targets:
        RecipeApp_macOS: all
        RecipeShareExtension_macOS: build
        RecipeAppTests_macOS: [test]
    test:
      targets:
        - RecipeAppTests_macOS
